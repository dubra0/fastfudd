<style>
:root{--bg:#0f1512;--panel:#17201c;--ink:#eaf3ee;--muted:#8fa69a;--line:#263430;--brand:#ff7a1a;--ok:#22c55e;--soft:#1c2a24;--f:"Vazirmatn",Tahoma,sans-serif;--fd:"Outfit",var(--f);color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.6}
.wrap{max-width:620px;margin:0 auto;padding:16px;padding-top:max(16px,env(safe-area-inset-top))}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.top b{font-family:var(--fd);font-weight:900;font-size:1.3rem}
.top .me{font-size:.85rem;color:var(--muted)}
.login{max-width:360px;margin:12vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;display:grid;gap:12px}
.login h1{font-family:var(--fd);text-align:center;margin:0}
.login .ic{font-size:44px;text-align:center}
input{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.btn{font:inherit;font-weight:900;border:0;border-radius:13px;padding:13px;cursor:pointer;background:linear-gradient(135deg,var(--brand),#ff9a3c);color:#1a0f02}
.btn.sm{padding:10px 16px;font-size:.9rem}
.btn.ok{background:linear-gradient(135deg,#22c55e,#15a35a);color:#04210f}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.msg{color:#ff8a74;font-weight:700;text-align:center;min-height:1.2em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card.acc{border-color:var(--ok)}
.chd{display:flex;justify-content:space-between;align-items:center;font-family:var(--fd);font-weight:900}
.badge{font-size:.72rem;border-radius:99px;padding:3px 10px;font-weight:800}
.badge.new{background:rgba(255,122,26,.16);color:var(--brand)}
.badge.mine{background:rgba(34,197,94,.16);color:var(--ok)}
.items{margin:8px 0;font-size:.92rem}
.meta{font-size:.85rem;color:var(--muted)}
.map{display:inline-block;margin:7px 0;color:var(--brand);font-weight:800;font-size:.9rem}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-family:var(--fd);font-weight:900;font-size:1.1rem;gap:10px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.cfg{background:#3a1b14;color:#ff9a84;padding:8px 12px;font-size:12px;text-align:center}
.live{font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.3}}
.gps{border-radius:12px;padding:10px 12px;font-size:.85rem;font-weight:700;margin-bottom:12px;background:var(--soft);color:var(--muted)}
.gps.on{background:rgba(34,197,94,.14);color:var(--ok)}.gps.bad{background:rgba(255,122,26,.16);color:var(--brand)}
.mapw{position:relative;margin-bottom:8px}
#dmap{height:42vh;min-height:260px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--soft)}
.rec{position:absolute;left:10px;bottom:10px;z-index:500;width:42px;height:42px;border-radius:12px;border:0;background:#fff;color:#111;font-size:20px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.mk{background:none;border:0}.mk span{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35);font-size:22px}
.mk.drv span{box-shadow:0 0 0 3px #ff7a1a,0 4px 14px rgba(0,0,0,.4)}
.dinfo{font-size:.9rem;font-weight:700;margin-bottom:12px;text-align:center}.dinfo a{color:var(--brand);text-decoration:none;font-weight:800}
.dist{color:var(--brand);font-weight:800;font-size:.85rem}
.satb{width:42px;height:42px;border:0;border-radius:10px;background:#fff;font-size:20px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.nav{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#15a35a,#0f7f46);color:#fff;border-radius:16px;padding:12px 14px;margin-bottom:10px}
.nav .ar{font-size:2.3rem;line-height:1;flex:none}
.nav b{display:block;font-size:1.12rem;font-weight:900;line-height:1.35}.nav small{font-size:.86rem;opacity:.92}
.mk.num span{background:var(--brand);color:#1a0f02;font-weight:900;font-size:17px;font-family:var(--fd)}
.pno{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--brand);color:#1a0f02;font-size:.85rem;margin-inline-end:6px}
.card.flash{box-shadow:0 0 0 3px var(--brand);transition:box-shadow .3s}
.cbd{background:var(--brand);color:#1a0f02;border-radius:99px;padding:0 7px;font-size:.75rem;margin-inline-start:4px}
.ov{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.6);display:none;align-items:flex-end}.ov.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:620px;margin:0 auto;border-radius:20px 20px 0 0;padding:16px;max-height:88vh;display:flex;flex-direction:column}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:900}
.chat{display:flex;flex-direction:column;gap:6px;overflow:auto;flex:1;min-height:30vh;padding:4px 2px 10px}
.bub{max-width:80%;padding:8px 12px;border-radius:16px;font-size:.93rem;line-height:1.5;word-break:break-word}.bub small{display:block;font-size:.68rem;opacity:.7}
.bub.me{align-self:flex-start;background:linear-gradient(135deg,#22c55e,#15a35a);color:#04210f}.bub.them{align-self:flex-end;background:var(--soft)}
.cin{display:flex;gap:8px}.cin input{flex:1}
</style>
</head>
<body>
<div id="cfgWarn" class="cfg" hidden>⚠️ تکایە KEY لە سەرەوەی کۆدەکە دابنێ</div>

<section id="login" class="login">
  <div class="ic">🛵</div>
  <h1>گەیەنەر</h1>
  <input id="dName" placeholder="ناوت" autocomplete="username">
  <input id="dPin" type="password" placeholder="PIN" autocomplete="current-password">
  <button class="btn" id="go">چوونەژوورەوە</button>
  <p class="msg" id="lmsg"></p>
</section>

<div id="app" class="wrap" hidden>
  <div class="top">
    <div><b>🛵 داواکارییەکان</b><div class="me" id="me"></div></div>
    <div style="display:flex;align-items:center;gap:10px"><span class="live"><span class="dot"></span>زیندوو</span><button class="btn ghost sm" id="pushBtn" hidden>🔔 ئاگادارکردنەوە</button><button class="btn ghost sm" id="out">دەرچوون</button></div>
  </div>
  <div id="gps" class="gps" hidden></div>
  <div class="nav" id="nav" hidden><span class="ar" id="navAr"></span><div><b id="navTxt"></b><small id="navSub"></small></div></div>
  <div class="mapw" id="mapw" hidden><div id="dmap" dir="ltr"></div><button class="rec" id="rec" type="button" aria-label="ناوەندکردن">🎯</button></div>
  <div class="dinfo" id="dinfo"></div>
  <div id="list"><div class="empty">چاوەڕێ بکە…</div></div>
</div>
<div class="ov" id="chatOv"><div class="sheet"><div class="sheet-h"><span id="chatTitle">💬 چات لەگەڵ کڕیار</span><button class="btn ghost sm" id="chatX">✕</button></div><div class="chat" id="chatList"></div><div class="cin" id="chatForm"><input id="chatIn" maxlength="300" placeholder="نامەکەت بنووسە…"><button class="btn ok sm" id="chatGo">ناردن</button></div><p class="meta" id="chatNote"></p></div></div>

<script>
if(top!==self) top.location=self.location;
const SUPA ="https://ytcoveaoimutrhxshinl.supabase.co/rest/v1/rpc/";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0Y292ZWFvaW11dHJoeHNoaW5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNjc2MTYsImV4cCI6MjEwODk0MzYxNn0.3Pi1oOlXsuLa7H32raI9bo6xitqa6qZHOdqs_1NwOLM";
const $ = id => document.getElementById(id);
const money = n => Number(n||0).toLocaleString("en-US") + " د.ع";
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
if (KEY.indexOf("PASTE")===0) $("cfgWarn").hidden=false;
async function rpc(fn, body){ const r=await fetch(SUPA+fn,{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY,Authorization:"Bearer "+KEY},body:JSON.stringify(body||{})}); return r.json(); }
function bell(){ try{ const A=window.AudioContext||window.webkitAudioContext; if(!A)return; const c=new A(); [988,1319,1760].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*0.14;o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.3,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.6);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+0.6);});}catch(e){} }

let me = { name:"", pin:"" }, timer=null, lastPending=0, started=false;
try{ const s=JSON.parse(localStorage.getItem("mln_drv")||"null"); if(s){ me=s; } }catch(e){}

async function login(){
  const name=$("dName").value.trim(), pin=$("dPin").value.trim();
  if(!name||!pin)return; $("go").disabled=true; $("lmsg").textContent="";
  let r; try{ r=await rpc("driver_login",{p_name:name,p_pin:pin}); }catch(e){ r=null; }
  $("go").disabled=false;
  if(!r||!r.ok){ $("lmsg").textContent=!r?"ئینتەرنێت نییە.":(r.ok===false&&!r.error)?"ناو یان PIN هەڵەیە.":"هەوڵی هەڵە زۆر بوو. ٣٠ خولەکی تر هەوڵ بدەرەوە."; return; }
  // تەنها تۆکنی کاتی هەڵدەگیرێت، نەک PIN
  me={name:r.name,pin:r.token}; try{ localStorage.setItem("mln_drv",JSON.stringify(me)); }catch(e){}
  enter();
}
function enter(){ $("login").hidden=true; $("app").hidden=false; $("me").textContent="بەخێربێیت "+me.name; startGps(); loop(); clearInterval(timer); timer=setInterval(loop,4000); pushOn(false); }
$("go").onclick=login; $("dPin").onkeydown=e=>{if(e.key==="Enter")login();};
$("out").onclick=async()=>{ clearInterval(timer); await pushOff(); try{localStorage.removeItem("mln_drv");}catch(e){} location.reload(); };

// ===== ئاگادارکردنەوە (Push): داواکاریی نوێ و نامەی کڕیار، تەنانەت کاتێک مۆبایل قوفڵە =====
const VAPID = "BEr-NhEN7MokO5XFSjm8y7r7h7tmMrOubsyyAIA1hvKmeVN_O7d1aahMOW0YYYfzsVbMzmdEl3mlrn14WBy4vlc";
const pushCan = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
function pushPaint(){ $("pushBtn").hidden = !pushCan() || Notification.permission==="granted"; }
async function pushOn(ask){
  pushPaint();
  if(!pushCan()) return;
  try{
    if(ask&&Notification.permission==="default") await Notification.requestPermission();
    if(Notification.permission==="denied"&&ask) alert("ئاگادارکردنەوە داخراوە. لە ڕێکخستنی مۆبایل › Notifications ڕێگەی پێ بدە.");
    if(Notification.permission!=="granted") return;
    const reg=await navigator.serviceWorker.ready;
    let s=await reg.pushManager.getSubscription();
    if(!s) s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:Uint8Array.from(atob(VAPID.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0))});
    const j=s.toJSON(); await rpc("driver_push_save",{p_name:me.name,p_pin:me.pin,p_ep:j.endpoint,p_key:j.keys.p256dh,p_auth:j.keys.auth});
  }catch(e){}
  pushPaint();
}
async function pushOff(){
  try{ const r=pushCan()&&await navigator.serviceWorker.getRegistration(); const s=r&&await r.pushManager.getSubscription(); if(s) await rpc("push_del",{p_ep:s.endpoint}); }catch(e){}
}
$("pushBtn").onclick=()=>pushOn(true);

// ===== چات لەگەڵ کڕیاری داواکارییەکی خۆت =====
let chatNum=null, chatTimer=null;
function openChat(num){ chatNum=num; $("chatTitle").textContent="💬 چات لەگەڵ کڕیار · "+num; $("chatOv").classList.add("on"); loadChat(); clearInterval(chatTimer); chatTimer=setInterval(loadChat,3000); }
function closeChat(){ $("chatOv").classList.remove("on"); clearInterval(chatTimer); chatNum=null; loop(); }
async function loadChat(){
  if(!chatNum) return;
  let r; try{ r=await rpc("driver_chat",{p_name:me.name,p_pin:me.pin,p_num:chatNum}); }catch(e){ return; }
  if(!r||!r.ok||!chatNum) return;
  const L=$("chatList"), atEnd=L.scrollHeight-L.scrollTop-L.clientHeight<40, msgs=r.msgs||[];
  L.innerHTML=msgs.length?msgs.map(m=>`<div class="bub ${m.s==="d"?"me":"them"}">${esc(m.b)}<small>${esc(m.t)}</small></div>`).join(""):`<p class="meta">هێشتا نامە نییە.</p>`;
  if(atEnd) L.scrollTop=L.scrollHeight;
  try{ localStorage.setItem("mln_dseen_"+chatNum,String(msgs.filter(m=>m.s==="c").length)); }catch(e){}
  $("chatForm").hidden=!r.open; $("chatNote").textContent=r.open?"":"داواکارییەکە تەواو بووە.";
}
async function sendChat(){
  const v=$("chatIn").value.trim(); if(!v||!chatNum) return;
  $("chatGo").disabled=true;
  let r; try{ r=await rpc("driver_send",{p_name:me.name,p_pin:me.pin,p_num:chatNum,p_body:v}); }catch(e){ r=null; }
  $("chatGo").disabled=false;
  if(r&&r.ok){ $("chatIn").value=""; loadChat(); } else alert("نەنێردرا.");
}
$("chatX").onclick=closeChat;
$("chatOv").onclick=e=>{ if(e.target.id==="chatOv") closeChat(); };
$("chatGo").onclick=sendChat;
$("chatIn").onkeydown=e=>{ if(e.key==="Enter") sendChat(); };

async function loop(){
  let r; try{ r=await rpc("driver_orders",{p_name:me.name,p_pin:me.pin}); }catch(e){ return; }
  if(!r) return;
  // تەنها وەڵامی ok:false واتە تۆکن بەسەرچووە؛ هەڵەی کاتی نابێت گەیەنەر بباتە دەرەوە
  if(r.ok===false){ clearInterval(timer); try{localStorage.removeItem("mln_drv");}catch(e){} $("login").hidden=false; $("app").hidden=true; return; }
  if(!r.ok) return;
  const orders=r.orders||[];
  mine=orders.filter(o=>o.status==="accepted"); allOrders=orders;
  // ژمارەی هەر داواکارییەکی چاوەڕوان، هەمان ژمارەی سەر نەخشەیە
  pendNo={}; orders.filter(o=>o.status==="pending").forEach((o,i)=>pendNo[o.num]=i+1);
  gpsSync(mine.length>0); syncMap(); sendPos();
  const pend=orders.filter(o=>o.status==="pending").length;
  if(started && pend>lastPending) bell();
  lastPending=pend; started=true;
  const busy=orders.some(o=>o.status==="accepted");
  $("list").innerHTML = orders.length ? orders.map(o=>{
    const mine=o.status==="accepted";
    const items=(o.items||[]).map(x=>`${esc(x.n)} × ${x.q}${x.note?` <span class="dist">📝 ${esc(x.note)}</span>`:""}`).join("<br>")+(o.note?`<div class="dist">📝 ${esc(o.note)}</div>`:"");
    const map=(o.lat&&o.lng)?`<a class="map" href="https://maps.google.com/?q=${o.lat},${o.lng}" target="_blank" rel="noopener">🗺️ شوێنی کڕیار لەسەر نەخشە</a>`:"";
    return `<div class="card ${mine?'acc':''}" id="card-${esc(o.num)}">
      <div class="chd"><span>${pendNo[o.num]?`<span class="pno">${pendNo[o.num]}</span>`:""}${esc(o.num)} · ${o.t||""}</span><span class="badge ${mine?'mine':'new'}">${mine?'من دەیبەم':'نوێ 🔔'}</span></div>
      <div class="items">${items}</div>
      <div class="meta">👤 ${esc(o.cust_name)} · 📞 ${esc(o.cust_phone)}</div>
      <div class="meta">📍 ${esc(o.address)}</div>${(pos&&o.lat&&o.lng)?`<div class="dist">📏 ${fmtKm(km(pos.lat,pos.lng,o.lat,o.lng))} لێتەوە</div>`:""}${map}
      ${mine?(()=>{ const un=Math.max(0,(o.msgs||0)-(+localStorage.getItem("mln_dseen_"+o.num)||0)); return `<div style="display:flex;gap:8px;margin-top:8px"><a class="btn ghost sm" style="flex:1;text-align:center;text-decoration:none" href="tel:${esc(String(o.cust_phone||"").replace(/[^0-9+]/g,""))}">📞 پەیوەندی</a><button class="btn ghost sm" style="flex:1" data-chat="${esc(o.num)}">💬 چات${un?`<span class="cbd">${un}</span>`:""}</button></div>`; })():""}
      <div class="foot"><b>${money(o.total)}</b>${mine?`<button class="btn ok sm" data-deliver="${esc(o.num)}">✅ گەیاندرا</button>`:busy?`<span class="meta">سەرەتا داواکارییەکەت بگەیەنە</span>`:`<button class="btn sm" data-take="${esc(o.num)}">🛵 من دەیبەم</button>`}</div>
    </div>`;
  }).join("") : `<div class="empty">ئێستا داواکاری نییە. چاوەڕێ بکە 🛵</div>`;
  $("list").querySelectorAll("[data-take]").forEach(b=>b.onclick=async()=>{ b.disabled=true; const r2=await rpc("accept_order",{p_name:me.name,p_pin:me.pin,p_num:b.dataset.take}); if(r2&&r2.ok){ follow=true; window.scrollTo({top:0,behavior:"smooth"}); loop(); } else{ alert(r2&&r2.error==="taken"?"ئەم داواکارییە وەرگیراوە.":r2&&r2.error==="busy"?"سەرەتا داواکارییەکەی ئێستات بگەیەنە، پاشان داواکاری نوێ وەربگرە.":"نەکرا."); loop(); } });
  $("list").querySelectorAll("[data-chat]").forEach(b=>b.onclick=()=>openChat(b.dataset.chat));
  $("list").querySelectorAll("[data-deliver]").forEach(b=>b.onclick=async()=>{ b.disabled=true; await rpc("deliver_order",{p_name:me.name,p_pin:me.pin,p_num:b.dataset.deliver}); loop(); });
}
// نەخشەکەت هەمیشە شوێنی خۆت نیشان دەدات؛ شوێن تەنها کاتی گەیاندن بۆ کڕیار دەنێردرێت
let watchId=null, lastSent=0, pos=null, fixAt=0, wake=null, delivering=false, mine=[], allOrders=[], pendNo={};
let leaflet=null, map=null, dMark=null, accC=null, routeLine=null, homes={}, follow=true, route=null, routeNum=null, routeAt=0, routeFrom=null, routeBusy=false;
const km = (a,b,c,d) => { const t=x=>x*Math.PI/180, h=Math.pow(Math.sin(t(c-a)/2),2)+Math.cos(t(a))*Math.cos(t(c))*Math.pow(Math.sin(t(d-b)/2),2); return 12742*Math.asin(Math.sqrt(h)); };
const fmtKm = k => k<1 ? `${Math.round(k*1000)} م` : `${k.toFixed(1)} کم`;
const mkIcon = (L,e,cls) => L.divIcon({className:"mk "+(cls||""),html:`<span>${e}</span>`,iconSize:[40,40],iconAnchor:[20,20]});
function loadLeaflet(){
  if(leaflet) return leaflet;
  leaflet = new Promise((res,rej)=>{
    const l=document.createElement("link"); l.rel="stylesheet"; l.href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"; l.integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb"; l.crossOrigin="anonymous"; document.head.appendChild(l);
    const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"; s.integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO"; s.crossOrigin="anonymous";
    s.onload=()=>res(window.L); s.onerror=()=>{ leaflet=null; rej(); }; document.head.appendChild(s);
  });
  return leaflet;
}
function gpsMsg(){
  const el=$("gps"); el.hidden=false;
  if(!pos){ el.className="gps"; el.textContent="📍 چاوەڕێی GPS…"; return; }
  el.className="gps on"; el.textContent=(delivering?"📍 شوێنەکەت بۆ کڕیار دەنێردرێت · پەڕەکە دامەخە":"📍 شوێنی ئێستات")+(pos.acc?` · وردی ±${Math.round(pos.acc)} م`:"");
}
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const inApp=/FBAN|FBAV|FB_IAB|Instagram|Snapchat|TikTok|Line\/|Telegram/i.test(navigator.userAgent);
function gpsFail(denied){
  const el=$("gps"); el.hidden=false; el.className="gps bad";
  const how = !denied ? "بڕۆ شوێنێکی کراوە و GPS هەڵبکە."
    : inApp ? "ئەم پەڕەیە لەناو ئەپێکدا کراوەتەوە. لینکەکە لە Safari یان Chrome بکەرەوە."
    : isIOS ? "لە iPhone: <b>Settings › Privacy &amp; Security › Location Services</b> هەڵبکە، پاشان <b>Safari Websites › While Using the App</b> و <b>Precise Location</b>. دوای ئەوە لە Safari <b>aA › Website Settings › Location › Allow</b> بکە و پەڕەکە Refresh بکە."
    : "ڕێگە بە Location بدە لە ڕێکخستنی وێبگەڕ و GPS هەڵبکە.";
  el.innerHTML=`⚠️ ${denied?"ڕێگە بە شوێن نەدراوە.":"شوێن نەدۆزرایەوە."} ${how} <button class="btn ghost sm" id="gpsRetry" style="margin-top:8px;width:100%">🔄 دووبارە هەوڵ بدەرەوە</button>`;
  $("gpsRetry").onclick=()=>{ if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; } startGps(); };
}
function startGps(){
  if(watchId!==null) return;
  if(!navigator.geolocation){ gpsFail(false); return; }
  gpsMsg();
  const onErr=e=>{
    if(e.code===1){ if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; } gpsFail(true); }
    else if(!pos) gpsFail(false);
  };
  // یەکەم شوێنی خێرا، پاشان GPS ـی ورد
  navigator.geolocation.getCurrentPosition(p=>{ if(!pos) onFix(p.coords); },()=>{},{enableHighAccuracy:false,maximumAge:60000,timeout:10000});
  watchId=navigator.geolocation.watchPosition(p=>onFix(p.coords), onErr, {enableHighAccuracy:true, maximumAge:0, timeout:20000});
}
// پاڵاوتنی GPS: هەڵەی ناکاو فڕێ دەدرێت و خوێندنەوەکان بەپێی وردییان تێکەڵ دەکرێن
let kal=null, jumps=0, routePts=[];
function kalman(c){
  const now=Date.now(), a=Math.max(c.accuracy,3);
  if(!kal){ kal={lat:c.latitude,lng:c.longitude,v:a*a,t:now}; return kal; }
  kal.v+=Math.max((now-kal.t)/1000,0.1)*100;
  const k=kal.v/(kal.v+a*a);
  kal.lat+=k*(c.latitude-kal.lat); kal.lng+=k*(c.longitude-kal.lng); kal.v*=1-k; kal.t=now;
  return kal;
}
// ئەگەر لە نزیک ڕێگاکە بوو، 🛵 دەلکێت بە شەقامەوە
function snap(p){
  if(!delivering||routePts.length<2) return p;
  const cs=Math.cos(p.lat*Math.PI/180), px=p.lng*cs, py=p.lat; let best=null, bd=Infinity;
  for(let i=1;i<routePts.length;i++){
    const ax=routePts[i-1][1]*cs, ay=routePts[i-1][0], dx=routePts[i][1]*cs-ax, dy=routePts[i][0]-ay;
    const t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/((dx*dx+dy*dy)||1e-12)));
    const qx=ax+t*dx, qy=ay+t*dy, d=Math.hypot(px-qx,py-qy)*111320;
    if(d<bd){ bd=d; best=[qy,qx/cs]; }
  }
  return bd<=Math.min(30,Math.max(12,p.acc*1.5)) ? {lat:+best[0].toFixed(6),lng:+best[1].toFixed(6),acc:p.acc} : p;
}
function onFix(c){
  // خوێندنەوەی زۆر هەڵە فڕێ دەدرێت، مەگەر ماوەیەک هیچی باشتر نەهاتبێت
  const now=Date.now();
  if(c.accuracy>50 && pos && now-fixAt<20000) return;
  if(kal){
    const d=km(kal.lat,kal.lng,c.latitude,c.longitude)*1000, dt=Math.max((now-kal.t)/1000,0.5);
    if(d/dt>45 && d>c.accuracy*2 && ++jumps<3) return;
  }
  jumps=0;
  const first=!pos; fixAt=now;
  const f=kalman(c);
  pos=snap({lat:+f.lat.toFixed(6), lng:+f.lng.toFixed(6), acc:c.accuracy});
  gpsMsg(); drawMe(); if(delivering) sendPos(first);
}
function gpsSync(on){
  if(on===delivering) return; delivering=on; if(watchId!==null&&pos) gpsMsg();
  try{
    if(on && "wakeLock" in navigator) navigator.wakeLock.request("screen").then(w=>wake=w).catch(()=>{});
    if(!on && wake){ wake.release(); wake=null; }
  }catch(e){}
  if(on) sendPos(true);
}
async function sendPos(force){
  if(!pos||!delivering) return; const now=Date.now();
  if(!force && now-lastSent<2000) return; lastSent=now;
  try{ await rpc("driver_ping",{p_name:me.name,p_pin:me.pin,p_lat:pos.lat,p_lng:pos.lng,p_acc:pos.acc}); }catch(e){}
}
async function ensureMap(){
  let L; try{ L=await loadLeaflet(); }catch(e){ return null; }
  if(!map){
    $("mapw").hidden=false;
    map=L.map("dmap").setView(pos?[pos.lat,pos.lng]:[36.5136,43.5977],14);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
    satCtl(L,map);
    map.on("dragstart",()=>follow=false);
    $("rec").onclick=()=>{ follow=true; fitAll(); };
  }
  return L;
}
function satCtl(L,m){
  const sat=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:20,maxNativeZoom:19,attribution:"© Esri"});
  const C=L.Control.extend({options:{position:"topright"},onAdd(){
    const b=L.DomUtil.create("button","satb"); b.type="button"; b.textContent="🛰️"; b.setAttribute("aria-label","وێنەی ئاسمانی");
    L.DomEvent.disableClickPropagation(b);
    b.onclick=()=>{ if(m.hasLayer(sat)){ m.removeLayer(sat); b.textContent="🛰️"; } else { sat.addTo(m); b.textContent="🗺️"; } };
    return b;
  }});
  m.addControl(new C());
}
// ڕێنمایی ڕێگا: هەنگاوی داهاتوو لە OSRM ـەوە
const TURN={left:["⬅️","بپێچەوە بۆ چەپ"],right:["➡️","بپێچەوە بۆ ڕاست"],"slight left":["↖️","کەمێک بڕۆ بۆ چەپ"],"slight right":["↗️","کەمێک بڕۆ بۆ ڕاست"],"sharp left":["⬅️","بە تیژی بپێچەوە بۆ چەپ"],"sharp right":["➡️","بە تیژی بپێچەوە بۆ ڕاست"],straight:["⬆️","ڕاستەوخۆ بڕۆ"],uturn:["↩️","بگەڕێوە دواوە"]};
function turnText(m){
  if(m.type==="arrive") return ["🏠","دەگەیتە ماڵی کڕیار"];
  if(m.type==="roundabout"||m.type==="rotary") return ["🔄",m.exit?`لە فلکەکە دەرچوونی ${m.exit} بگرە`:"بچۆ ناو فلکەکە"];
  return TURN[m.modifier]||TURN.straight;
}
function paintNav(){
  const n=$("nav"), s=route&&route.steps;
  if(!delivering||!s||!s.length||!pos){ n.hidden=true; return; }
  let i=1;
  while(i<s.length-1 && km(pos.lat,pos.lng,s[i].maneuver.location[1],s[i].maneuver.location[0])<0.015) i++;
  const st=s[Math.min(i,s.length-1)], m=st.maneuver, [ar,txt]=turnText(m);
  const d=km(pos.lat,pos.lng,m.location[1],m.location[0]);
  $("navAr").textContent=ar; $("navTxt").textContent=txt;
  $("navSub").textContent=`دوای ${fmtKm(d)}${st.name?` · ${st.name}`:""}`;
  n.hidden=false;
}
function fitAll(){
  if(!map) return; const p=[]; if(dMark) p.push(dMark.getLatLng()); Object.values(homes).forEach(m=>p.push(m.getLatLng()));
  if(p.length>1) map.fitBounds(p,{padding:[50,50],maxZoom:17}); else if(p.length) map.setView(p[0],17);
}
async function drawMe(){
  if(!pos) return; const L=await ensureMap(); if(!L) return;
  const d=[pos.lat,pos.lng];
  const isNew=!dMark;
  if(isNew) dMark=L.marker(d,{icon:mkIcon(L,"🛵","drv"),zIndexOffset:1000}).addTo(map); else dMark.setLatLng(d);
  if(!accC) accC=L.circle(d,{radius:pos.acc||0,color:"#ff7a1a",weight:1,fillOpacity:.1}).addTo(map); else { accC.setLatLng(d); accC.setRadius(pos.acc||0); }
  if(isNew) fitAll();
  else if(follow){
    // هەمیشە 🛵 و 🏠 پێکەوە لەسەر شاشە دەمێننەوە
    const b=map.getBounds().pad(-0.1);
    if(!b.contains(d)||Object.values(homes).some(m=>!b.contains(m.getLatLng()))) fitAll();
  }
  paintNav();
}
async function syncMap(){
  // پێش وەرگرتن هەموو داواکارییەکان، و دوای وەرگرتن تەنها ئەوەی خۆی نیشان دەدرێت
  const with_=(mine.length?mine:allOrders).filter(o=>o.lat&&o.lng);
  const t=mine.filter(o=>o.lat&&o.lng)[0];
  const info=$("dinfo");
  if(!mine.length){ info.textContent=with_.length?"🏠 شوێنی کڕیارەکان لەسەر نەخشەیە":""; }
  else if(!t){ info.textContent="⚠️ کڕیار شوێنی نەناردووە، ناونیشانەکە بخوێنەوە یان پەیوەندی پێوە بکە"; }
  if(!t) $("nav").hidden=true;
  if(!with_.length && !Object.keys(homes).length && !routeLine) return;
  const L=await ensureMap(); if(!L) return;
  Object.keys(homes).forEach(n=>{ if(!with_.some(o=>o.num===n)){ homes[n].remove(); delete homes[n]; } });
  let added=false;
  // پێش وەرگرتن هەر داواکارییەک ژمارەی خۆی هەیە، کلیک لەسەری کارتەکەی دەدۆزێتەوە
  with_.forEach(o=>{
    const no=!mine.length&&pendNo[o.num], tip=`${o.num} · ${money(o.total)}${pos?` · ${fmtKm(km(pos.lat,pos.lng,o.lat,o.lng))}`:""}`;
    if(!homes[o.num]){
      homes[o.num]=L.marker([o.lat,o.lng],{icon:mkIcon(L,no||"🏠",no?"num":"")}).bindTooltip(tip).addTo(map); added=true;
      homes[o.num].on("click",()=>{ const c=$("card-"+o.num); if(c){ c.scrollIntoView({behavior:"smooth",block:"center"}); c.classList.add("flash"); setTimeout(()=>c.classList.remove("flash"),1500); } });
    } else { homes[o.num].setIcon(mkIcon(L,no||"🏠",no?"num":"")); homes[o.num].setTooltipContent(tip); }
  });
  if(added&&follow) fitAll();
  if(!t){ if(routeLine){ routeLine.remove(); routeLine=null; } route=null; routeNum=null; routePts=[]; return; }
  if(pos){
    const left=km(pos.lat,pos.lng,t.lat,t.lng);
    await refreshRoute(L,t);
    info.innerHTML=`🏠 ${esc(t.num)} · ${fmtKm(route&&routeNum===t.num?route.km:left)} ماوە · ~${route&&routeNum===t.num?route.min:Math.max(1,Math.ceil(left/25*60))} خولەک · <a href="https://www.google.com/maps/dir/?api=1&destination=${t.lat},${t.lng}&travelmode=driving" target="_blank" rel="noopener">🧭 Google Maps</a>`;
    paintNav();
  }
}
async function refreshRoute(L,t){
  const now=Date.now();
  if(routeBusy || (routeNum===t.num && route && (now-routeAt<10000 || km(routeFrom[0],routeFrom[1],pos.lat,pos.lng)<0.025))) return;
  routeBusy=true; routeAt=now; const from=[pos.lat,pos.lng];
  try{
    const j=await fetch(`https://router.project-osrm.org/route/v1/driving/${from[1]},${from[0]};${t.lng},${t.lat}?overview=full&geometries=geojson&steps=true`).then(x=>x.json());
    const rt=j.routes&&j.routes[0];
    if(rt){
      route={km:rt.distance/1000, min:Math.max(1,Math.round(rt.duration/60)), steps:rt.legs[0].steps}; routeNum=t.num; routeFrom=from;
      const ll=rt.geometry.coordinates.map(p=>[p[1],p[0]]);
      routePts=ll;
      if(routeLine) routeLine.setLatLngs(ll); else routeLine=L.polyline(ll,{color:"#ff7a1a",weight:5,opacity:.8}).addTo(map);
    }
  }catch(e){}
  routeBusy=false;
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && me.pin){ startGps(); try{ if(delivering && "wakeLock" in navigator) navigator.wakeLock.request("screen").then(w=>wake=w).catch(()=>{}); }catch(e){} loop(); } });
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
if(me.pin) enter();
</script>
